# Xcode project definition. Generate SpamShield.xcodeproj with:  xcodegen generate
# Don't edit the .xcodeproj by hand; change this file and regenerate.
name: SpamShield

options:
  bundleIdPrefix: com.emirchngr
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # Texts in the code are Turkish keys; App/Localizable.xcstrings holds both the English and the Turkish text,
  # so both languages get their own .lproj. With Turkish as the source language Xcode makes no tr.lproj,
  # and iOS then falls back to English on Turkish phones.
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Pick your team in Xcode (Signing & Capabilities) or put the Team ID here.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    # Lets the compiler list the texts in the code, so they can be checked against Localizable.xcstrings.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

packages:
  FilterCore:
    path: FilterCore

targets:
  SpamShield:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: FilterCore
      - target: MessageFilter
      - target: ShareExtension
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Spam Shield
        # Phones in a language other than Turkish or English get English.
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [tr, en]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Where the app downloads new rules from (see README, "Kural listesini güncelleme").
        RulesUpdateURL: https://cihangiremir.github.io/spam-shield/rules.json
        # Background check for new rules; the ID must match SpamShieldApp.rulesRefreshTaskID.
        BGTaskSchedulerPermittedIdentifiers: [com.emirchngr.spamshield.rules-refresh]
        UIBackgroundModes: [fetch]
    entitlements:
      path: App/SpamShield.entitlements
      properties:
        # Must match RuleStore.appGroupIdentifier.
        com.apple.security.application-groups: [group.com.emirchngr.spamshield]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.emirchngr.spamshield
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  MessageFilter:
    type: app-extension
    platform: iOS
    sources: [MessageFilter]
    dependencies:
      - package: FilterCore
      - sdk: IdentityLookup.framework
    info:
      path: MessageFilter/Info.plist
      properties:
        CFBundleDisplayName: Spam Shield
        NSExtension:
          NSExtensionPointIdentifier: com.apple.identitylookup.message-filter
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MessageFilterExtension
    entitlements:
      path: MessageFilter/MessageFilter.entitlements
      properties:
        com.apple.security.application-groups: [group.com.emirchngr.spamshield]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.emirchngr.spamshield.MessageFilter
        TARGETED_DEVICE_FAMILY: "1"

  # Messages › long press › Share › Spam Shield: the Check tab's rule suggestions for a shared message.
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      # Shared with the app: the Check form and the rule list it saves to.
      - App/CheckView.swift
      - App/RuleListModel.swift
      - App/FilterCore+Display.swift
      - App/Localizable.xcstrings
    dependencies:
      - package: FilterCore
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Spam Shield
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [tr, en]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups: [group.com.emirchngr.spamshield]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.emirchngr.spamshield.ShareExtension
        TARGETED_DEVICE_FAMILY: "1"
